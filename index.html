<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ramirez Family Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>The Ramirez Family Archive</h1>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="year" role="tab" aria-selected="true">By Year</button>
  <button class="tab-btn" data-tab="people" role="tab" aria-selected="false">By Person</button>
</nav>

<div class="page-body">
  <aside class="year-dial-wrap" id="year-dial-wrap">
    <div class="year-dial-marker" aria-hidden="true"></div>
    <div class="year-dial" id="year-dial" tabindex="0"></div>
  </aside>

  <main>
  <section id="player-area" class="player-area">
    <div class="player-shell">
      <div class="player-wrap">
        <div id="yt-player"></div>
        <button class="click-catcher" id="click-catcher" aria-label="Play or pause"></button>
        <button class="big-play" id="big-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="control-bar">
          <button class="ctrl-btn" id="play-toggle" aria-label="Play or pause">
            <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            <svg class="icon-play" viewBox="0 0 24 24" hidden><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="scrub-track" id="scrub-track">
            <div class="scrub-fill" id="scrub-fill"></div>
            <div class="scrub-ticks" id="scrub-ticks"></div>
          </div>
          <span class="time-display" id="time-display">0:00</span>
          <button class="ctrl-btn" id="mute-toggle" aria-label="Mute or unmute">
            <svg class="icon-unmuted" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
            <svg class="icon-muted" viewBox="0 0 24 24" hidden><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2 2.5 2.5 1.5-1.5-2.5-2.5 2.5-2.5-1.5-1.5-2.5 2.5-2.5-2.5-1.5 1.5 2.5 2.5-2.5 2.5 1.5 1.5z"/></svg>
          </button>
        </div>
      </div>
      <button class="unmute-hint" id="unmute-hint" hidden>Tap for sound</button>
    </div>
    <div class="now-playing">
      <h2 id="now-playing-title">Pick a year or a person to start watching</h2>
      <ol id="chapter-list" class="chapter-list"></ol>
    </div>
  </section>

  <section id="panel-year" class="panel" data-panel="year">
    <div class="video-sublist" id="video-sublist"></div>
  </section>

  <section id="panel-people" class="panel" data-panel="people" hidden>
    <div class="people-list" id="people-list"></div>
    <ol id="person-clip-list" class="clip-list"></ol>
  </section>
  </main>
</div>

<footer>
  <p>Digitized and archived by Luke. Click any timestamp to jump straight there.</p>
</footer>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
