<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ramirez Family Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1>The Ramirez Family Archive</h1>
  <p class="tagline">Home movies, digitized. Super 8 &amp; VHS &rarr; forever.</p>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="year" role="tab" aria-selected="true">By Year</button>
  <button class="tab-btn" data-tab="people" role="tab" aria-selected="false">By Person</button>
</nav>

<main>
  <section id="player-area" class="player-area">
    <div class="player-wrap">
      <div id="yt-player"></div>
    </div>
    <div class="now-playing">
      <h2 id="now-playing-title">Pick a year or a person to start watching</h2>
      <ol id="chapter-list" class="chapter-list"></ol>
    </div>
  </section>

  <section id="panel-year" class="panel" data-panel="year">
    <div class="year-list" id="year-list"></div>
  </section>

  <section id="panel-people" class="panel" data-panel="people" hidden>
    <div class="people-list" id="people-list"></div>
    <ol id="person-clip-list" class="clip-list"></ol>
  </section>
</main>

<footer>
  <p>Digitized and archived by Luke. Click any timestamp to jump straight there.</p>
</footer>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
